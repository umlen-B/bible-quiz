name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Binds the job to the "production" environment so `vars.VITE_GA_ID` is
    # read from that environment's variables. GitHub resolves environment
    # variables first and falls back to repository-level ones, so setting it
    # in either place works.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test

      - name: Check the analytics id is present
        env:
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
        run: |
          if [ -z "$VITE_GA_ID" ]; then
            echo "::warning::VITE_GA_ID is not set — the site will build with analytics compiled out."
          else
            echo "Analytics enabled for $VITE_GA_ID"
          fi

      # The id is read at build time, so a build made without it stays without
      # it. Changing the variable needs a re-run, not just a page reload.
      - run: npm run build
        env:
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
